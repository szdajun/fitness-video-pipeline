[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-video-pipeline"
version = "1.0.0"
description = "健身短视频处理流水线 — 横拍转竖版、体型调整、运镜效果"
readme = "README.md"
# 3.9 已 EOL(2025-10); 升 3.11 (与 ComfyUI venv 同大版本, 性能 +10-25%).
# uv 按 .python-version (3.11) + 本文件管理依赖, uv.lock 锁定可复现.
requires-python = ">=3.11"
authors = [
    {name = "User"}
]
keywords = ["video", "fitness", "9:16", "portrait", "竖版视频"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 主管线核心依赖 (requirements.txt 搬入 + 补 scipy/pillow).
# numpy 钉 <2: 项目代码在 numpy 1.x 验证, 2.x 有 breaking (np.float_ 删等), 升 2.x 前需验证.
# torch 不在此 (大 + GPU/CPU 分流): GPU 用 [gpu] extra, 默认 ultralytics 会拉 CPU torch.
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24,<2",
    "pyyaml>=6.0",
    "filterpy>=1.4.5",
    "scipy>=1.10",
    "pillow>=9.0",
    "ultralytics>=8.0.0",
    "mediapipe>=0.10,<0.11",
    "insightface>=0.7.3",
    "onnxruntime-gpu>=1.19.0",
]

[project.optional-dependencies]
# GPU torch (RVM 抠像 bg_swap 用); 走 PyTorch cu124 index (复用旧 venv 验证的 2.6.0+cu124 组合, CUDA 13.1 driver 向下兼容).
# 用法: uv sync --extra gpu --extra dev  (conditional source: 仅 --extra gpu 时 torch 从 cu124, 否则 PyPI CPU).
gpu = ["torch>=2.0.0", "torchvision>=0.15.0"]
dev = ["pytest>=8.0"]

[tool.uv.sources]
# 仅 --extra gpu 时 torch/torchvision 从 cu124 index; 平时 uv sync 仍装 CPU 版 (轻量, 测试/开发够).
torch = [{ index = "pytorch-cu124", extra = "gpu" }]
torchvision = [{ index = "pytorch-cu124", extra = "gpu" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
fitness-pipeline = "main:main"

[project.urls]
Homepage = "https://github.com/user/fitness-video-pipeline"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*", "stages*", "lib*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
