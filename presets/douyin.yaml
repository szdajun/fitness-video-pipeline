# 抖音 (Douyin) 适配预设
# 输出: 9:16 1080x1920 竖版短视频
# 设计: 画面小, 干净简洁 — 只保留换脸+弹幕+节拍, 去掉吉祥物/能量条/汉印/PIP
# 用法: python main.py process input.mp4 --preset douyin
stages:
  h2v_convert: false
  stabilize: false
  beat_flash: true
  highlight: true
  energy_bar: false         # 9:16 空间小, 关掉
  intro_outro: false        # 裁切后文字被切, 关掉
  ken_burns: false
  body_warp: false
  pip: false                # 画面小, 不叠画中画
  mascot: false             # 画面小, 不要吉祥物
  danmaku: true             # 弹幕氛围
  intensity_burst: true
  skeleton_overlay: false
  person_count: false
  lead_box: false
  lead_ghost: false
  face_blur: false
  motion_heatmap: false
  sync_score: false
  bgm_beat: false

output:
  width: 1080
  height: 1920

# 水印去汉印
watermark:
  show_seal: false          # 抖音不要汉印

# 弹幕
danmaku:
  enabled: true
  font_size: 48
  interval: 45

formats: []
