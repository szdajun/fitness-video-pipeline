# YouTube Shorts / 抖音 / 快手 竖屏版本 9:16
# 设计: 视频本体居中 + 完整片头片尾 + PIP/mascot/danmaku/energy_bar 装饰
# 用户原话: 视频本体占满全屏 + 完整装饰元素
stages:
  h2v_convert: false       # 用户原话: 原视频就是宽幅, 不需要转 9:16
  stabilize: false
  beat_flash: true
  highlight: true
  energy_bar: true
  intro_outro: true        # 完整片头片尾 (胭脂虎健身團 + 帶操人 + 漢細柳營)
  ken_burns: false
  body_warp: false         # 用户原话: 暂时禁用, 避免 h2v_size=None 崩
  pip: true                # 画中画右下
  mascot: true             # 小老虎左下
  danmaku: true            # 弹幕
  intensity_burst: true
  face_swap: true           # 美颜换脸 (枫林红/艳青/丽丽等 6 位教练有美颜照)
  skeleton_overlay: false
  person_count: false
  lead_box: false
  lead_ghost: false
  face_blur: false
  motion_heatmap: false
  sync_score: false

# 不覆盖 output.width/height - 沿用 config.yaml 的 1920x1080 (16:9)
# 因为 16:9 源 + 16:9 输出 = 视频占满全屏 (用户原话)
# config.yaml 里 output.width: 1920, height: 1080 保持

color_grade:
  brightness: 0
  clahe: true

# Mascot 默认尺寸
mascot:
  enabled: true
  size: 180
  position: bottom-left
  bounce_range: 15

# Watermark 默认
watermark:
  watermark_text: "细柳营·胭脂虎"
  watermark_position: top-right
  watermark_size: 24
  watermark_alpha: 0.7
  show_date: true

# 完整 intro_outro
intro_outro:
  channel_name: "胭脂虎健身團"
  cta_text: "关注不迷路"
  intro_duration: 4.0
  outro_duration: 5.0
  audio_fade_out: 3.0

# PIP 右下
pip:
  enabled: true
  position: bottom-right
  scale: 0.25
  margin: 10
  border: 6

# 弹幕
danmaku:
  enabled: true
  font_size: 36            # 降低字号 (之前 50 在 1080p 上偏大)
  interval: 60
  stroke_width: 4          # 描边加粗, 防止和视频颜色混
