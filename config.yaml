# 健身短视频处理流水线 — 低码率源专用配置
# 用法: python main.py input.mp4 -c config.yaml

process_isolate: false  # 子进程隔离导致 GPU access violation, 暂时关闭

stages:
  pre_deblock: false
  pose_detect: true
  stabilize: false          # 排查
  h2v_convert: false
  body_warp: false
  ken_burns: false          # 关：艳青6手臂抖动排查
  face_warp: false
  color_grade: false
  skin_tone_filter: false
  denoise: false            # 暂关-可能发白
  audio: false
  skeleton_overlay: false
  person_count: false
  lead_box: false
  lead_ghost: false
  face_blur: false
  motion_heatmap: false
  sync_score: false
  beat_flash: true          # 进程隔离不卡父进程
  highlight: true          # 进程隔离
  energy_bar: true
  skin_smooth: true         # 开
  intro_outro: true
  watermark: true           # 叠加：水印
  blush: false
  face_beautify2: false      # 关：CPU 太慢，GPU 修复后再开
  mascot: true             # 叠加：吉祥物猫咪
  rife: false              # 关：磁盘空间不够暂关
  bgm_beat: false           # 关闭: 原视频自带伴奏节拍，不混入外部BGM
  pip: true                 # 画中画
  speed_ramp: false         # 关：此源节拍太密
  film_look: false          # 暂关-排查发白
  danmaku: true            # 弹幕特效
  intensity_burst: true     # 爆燃大字
  qin_cold_open: false      # 秦腔开场（未调通，暂关）
  export: true
  face_swap: true          # 美颜换脸

pose_backend: yolo
pose_model: yolov8m-pose
pose_gpu: true             # RTX 4070 CUDA 加速

output:
  width: 1920
  height: 1080
  encoder: auto
  crf: 14
  deblock: "0:0"
  sharpen: 0.8
  upscale_mode: lanczos    # lanczos=快速缩放, realesrgan=AI超分(仅限高清源)
  realesrgan_scale: 2
  realesrgan_tile: 256
  realesrgan_gpu: true
  realesrgan_max_frames: 0   # 关闭AI超分，低码率源只会放大噪点
  # 多平台分发: 一次跑输出多个格式 (主输出后追加, 不替换)
  #   - '9x16': 抖音/小红书 Shorts 竖版 1080x1920
  #   - '16x9': YouTube/B站 横版 1920x1080
  # 留空 = 只输出主格式 (width x height)
  formats: ['16x9']

color_grade:
  brightness: 0
  clahe: true
  sharpen: 0.3

ken_burns:
  mode: smooth
  zoom_range: [1.0, 1.03]

energy_bar:
  width: 16
  margin_right: 20
  margin_bottom: 60
  height: 300
  smoothing: 0.85
  min_fill_ratio: 0.15

denoise:
  denoise_strength: 2
  denoise_mode: hqdn3d

stabilize:
  shakiness: 7
  accuracy: 15
  smoothing: 15

skin_smooth:
  enabled: true
  strength: 0.15            # 降低磨皮强度 (0.3→0.15, 减少模糊)
  d: 5                      # 缩小滤波直径 (7→5, 更精细)
  sigmaColor: 10            # 缩小颜色空间标准差 (15→10)
  sigmaSpace: 10
  downscale: 0.5

rife:
  enabled: true
  target_fps: 60
  gpu: true
  half_precision: true

pre_deblock:
  enabled: true
  quality: 4
  mode: 1

watermark:
  watermark_text: "细柳营·胭脂虎"
  watermark_position: top-right

mascot:
  enabled: true
  size: 180
  position: bottom-left
  bounce_range: 15

bgm_beat:
  enabled: true
  bgm_file: "F:/wkspace/fitness-video-pipeline/assets/bgm.mp3"  # BGM 文件路径
  bg_volume: 0.5
  beat_volume: 0.8
  beat_width: 0.12
  bgm_ratio: 0.35

pip:
  enabled: true
  position: bottom-right
  scale: 0.25
  margin: 10
  border: 6

speed_ramp:
  enabled: true
  slow_speed: 0.6
  slow_window: 0.15

film_look:
  enabled: true
  preset: golden_hour    # warm_vintage / cool_cinema / bw_classic / golden_hour / teal_orange

danmaku:
  enabled: true
  font_size: 28
  interval: 60

face_beautify2:
  enabled: true
  mode: insightface
  skin_smooth: 0.42    # 自然磨皮（Gemini建议0.4-0.45）
  eye_brighten: 0.28   # 眼周提亮
  face_whiten: 0.22    # 肤色美白
  face_slim: 0.05      # 轻微瘦脸（几何变形有风险，保守）
  eye_enlarge: 0.03    # 微大眼（几何变形有风险，保守）

qin_cold_open:
  enabled: true
  audio_file: "F:/wkspace/fitness-video-pipeline/assets/qin_cold_open.mp3"

# 搜索引擎优化（自动生成标题/描述/标签）
seo:
  enabled: true
  channel: "细柳营健身"
  traditional: true   # 标题/描述自动转繁体中文（港台/东南亚受众）
  seo_keywords: "户外燃脂操｜零基础不伤膝｜跟练打卡"
  intensity: "中等强度"
  audience: "所有水平 / 新手友好"
  tags:
    - "有氧健身操"
    - "暴汗燃脂"
    - "瘦全身"
    - "居家健身"
    - "跟练"
    - "瘦肚子"
    - "女性健身"
    - "新手友好"
    - "细柳营胭脂虎"

# 美颜换脸参数（阶段启用/禁用见下方 stages.face_swap）
